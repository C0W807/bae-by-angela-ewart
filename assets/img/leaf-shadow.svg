    <use href="#leaf" transform="translate(420 400) rotate(62)"/>
    <use href="#leaf" transform="translate(330 445) rotate(-38)"/>
    <use href="#leaf" transform="translate(370 500) rotate(58)"/>
    <use href="#leaf" transform="translate(280 545) rotate(-42)"/>
    <use href="#leaf" transform="translate(320 600) rotate(64)"/>
    <use href="#leaf" transform="translate(230 650) rotate(-36)"/>
