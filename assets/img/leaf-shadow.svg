    <use href="#leaf" transform="translate(470 160) rotate(-40)"/>
    <use href="#leaf" transform="translate(515 215) rotate(60)"/>
    <use href="#leaf" transform="translate(420 250) rotate(-35)"/>
    <use href="#leaf" transform="translate(465 305) rotate(55)"/>
